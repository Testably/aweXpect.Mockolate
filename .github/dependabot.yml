version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Europe/Vienna"
    commit-message:
      prefix: chore
    groups:
      fallout:
        patterns:
          - "Fallout*"
      tunit:
        patterns:
          - "TUnit*"
      aweXpect:
        patterns:
          - "aweXpect*"
